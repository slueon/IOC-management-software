name: IOC Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-verify:
    name: Build, Lint & Deterministic Verifier Gate
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore IOCManagement.sln

      - name: Build Solution with Strict Static Analysis (-warnaserror)
        run: dotnet build IOCManagement.sln --configuration Release --no-restore -warnaserror

      - name: Execute Full Test Suite & Measure Coverage
        run: >
          dotnet test IOCManagement.sln 
          --configuration Release 
          --no-build 
          --verbosity normal 
          --collect:"XPlat Code Coverage" 
          --results-directory ./TestResults

      - name: Upload Test Results & Code Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: ./TestResults
